<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#607482"/></marker></defs><rect x="0" y="0" width="1600.08" height="900.0" rx="0" fill="#F7F8F6" stroke="#F7F8F6"/><text x="66.0" y="46.95" font-family="Noto Sans CJK TC" font-size="17.5035" font-weight="700" fill="#007F82" text-anchor="start">RESEARCH MEETING</text><text x="66.0" y="146.7" font-family="Noto Sans CJK TC" font-size="48.343" font-weight="700" fill="#142D40" text-anchor="start">主要衝突定義：同一 x 命中多個 decisions</text><rect x="72.0" y="222.0" width="486.0" height="76.8" rx="4.8" fill="#142D40" stroke="#142D40"/><text x="87.6" y="265.8" font-family="Noto Sans CJK TC" font-size="30.006" font-weight="700" fill="#FFFFFF" text-anchor="start">Test x → Matching rules M(x)</text><line x1="314.40000000000003" y1="306.0" x2="314.40000000000003" y2="351.6" stroke="#607482" stroke-width="2" marker-end="url(#arrow)"/><rect x="72.0" y="356.40000000000003" width="486.0" height="100.8" rx="4.8" fill="#E5F2F0" stroke="#E5F2F0"/><text x="90.0" y="411.6" font-family="Noto Sans CJK TC" font-size="33.34" font-weight="700" fill="#007F82" text-anchor="start">Distinct decisions 有幾種？</text><line x1="567.6" y1="405.59999999999997" x2="636.0" y2="271.2" stroke="#607482" stroke-width="2" marker-end="url(#arrow)"/><rect x="648.0" y="228.0" width="834.0" height="98.39999999999999" rx="6.0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="672.0" y="282.9" font-family="Noto Sans CJK TC" font-size="38.341" font-weight="700" fill="#607482" text-anchor="start">0</text><text x="768.0" y="279.0" font-family="Noto Sans CJK TC" font-size="30.006" font-weight="700" fill="#607482" text-anchor="start">Default class</text><line x1="567.6" y1="405.59999999999997" x2="636.0" y2="419.99999999999994" stroke="#007F82" stroke-width="2" marker-end="url(#arrow)"/><rect x="648.0" y="376.79999999999995" width="8