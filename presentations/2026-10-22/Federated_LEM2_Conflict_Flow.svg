="25.005" font-weight="400" fill="#20394A" text-anchor="start">不同 decision；僅作結構稽核。</text><rect x="648.0" y="699.6" width="834.0" height="69.6" rx="6.0" fill="#E5F2F0" stroke="#E5F2F0"/><text x="672.0" y="726.3" font-family="Noto Sans CJK TC" font-size="21.671" font-weight="400" fill="#20394A" text-anchor="start">A = 1 → Yes     /     A = 1, B = 2 → No</text><text x="672.0" y="755.57152" font-family="Noto Sans CJK TC" font-size="21.671" font-weight="400" fill="#20394A" text-anchor="start">x = (A = 1, B = 2)：非 exact，但有 inference conflict</text><rect x="66.0" y="800.4" width="1466.4" height="1.44" rx="0" fill="#D8E1E3" stroke="#D8E1E3"/><text x="66.0" y="831.3" font-family="Noto Sans CJK TC" font-size="18.337" font-weight="400" fill="#607482" text-anchor="start">圖意｜Inference conflict 包含非完全相同條件的規則重疊。</text><text x="66.0" y="871.5" font-family="Noto Sans CJK TC" font-size="15.003" font-weight="400" fill="#607482" text-anchor="start">來源：鎖定研究事實 §3；Lindgren (2004)；Lindgren &amp; Boström (2002)</text><text x="1532.4" y="863.6999999999999" font-family="Noto Sans CJK TC" font-size="18.337" font-weight="400" fill="#607482" text-anchor="end">05</text></svg>