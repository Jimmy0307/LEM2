name: Apply Teacher Evidence Patch

on:
  push:
    branches:
      - research/conflict-client-sweep-20261020
    paths:
      - tools/apply_teacher_evidence_patch_trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: research/conflict-client-sweep-20261020
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded patch
        run: python tools/apply_teacher_evidence_patch.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q roughset main.py tools/target_case_backtrace.py
      - name: Test
        run: python -m pytest -q
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roughset/evaluation.py roughset/pipeline.py roughset/batch.py tools/target_case_backtrace.py
          git commit -m "feat: close teacher evidence gaps"
          git push origin HEAD:research/conflict-client-sweep-20261020
