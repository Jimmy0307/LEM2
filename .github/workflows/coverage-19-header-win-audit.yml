name: LEM2 Coverage 19 Columns and Policy Win Audit
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths: [teacher_demo/build_coverage_19_columns.py, .github/workflows/coverage-19-header-win-audit.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Build 19-header dataset-level test coverage and win counts
        run: python -m teacher_demo.build_coverage_19_columns
      - name: Check table contract and ties without double counting
        run: |
          python - <<'PY'
          import json,pandas as pd,numpy as np
          from pathlib import Path
          root=Path("docs/research/teacher_dashboard/coverage_research")
          meta=json.loads((root/"manifest.json").read_text())
          t=pd.read_csv(root/"COVERAGE_19_COLUMNS_42SEEDS.csv")
          e=pd.read_csv(root/"POLICY_WIN_EVENTS_BY_DATASET.csv")
          assert meta["column_count"]==len(t.columns)==19
          assert len(t)==9828
          assert t.train_rule_coverage_pct.isna().all()
          assert t.test_minus_train_coverage_pp.isna().all()
          assert t[t.distribution=="NONIID_DIRICHLET"].test_covered_only_accuracy_pct.isna().all()
          g=e.groupby(["dataset","distribution","dirichlet_alpha","seed","client_count","objective"],dropna=False)
          assert g.size().eq(6).all()
          assert np.allclose(g.fractional_win.sum().values,1)
          print("COVERAGE_19_HEADERS_WIN_AUDIT_PASS",len(t),len(e))
          PY
      - name: Publish tables and machine-readable schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/teacher_dashboard/coverage_research/
          if ! git diff --cached --quiet; then
            git commit -m "research: publish one 19-header table and per-dataset policy wins [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lem2-coverage-19-columns-and-wins
          path: docs/research/teacher_dashboard/coverage_research/
          if-no-files-found: error
