name: Verify expanded 188-dataset 42-seed website
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - docs/research/teacher_dashboard/expanded42/**
      - .github/workflows/verify-expanded42-website.yml
permissions:
  contents: read
jobs:
  website-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify static JSON and JavaScript
        run: |
          node --check docs/research/teacher_dashboard/expanded42/expanded42.js
          node --check docs/research/teacher_dashboard/expanded42/timeout/timeout.js
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("docs/research/teacher_dashboard/expanded42")
          data=json.loads((root/"data.json").read_text(encoding="utf-8"))
          rows=data["rows"];m=data["meta"]
          assert len(rows)==188
          assert sum(r["features"]<=6 for r in rows)==26
          assert sum(r["features"]>6 for r in rows)==162
          assert sum(r["status"]=="COMPLETE" for r in rows)==179
          assert sum(r["status"]=="COMPLETE" and r["features"]<=6 for r in rows)==25
          assert sum(r["status"]=="COMPLETE" and r["features"]>6 for r in rows)==154
          assert m["completeModels"]==30078 and m["expectedModels"]==31584
          assert all(1<=r["usedFeatures"]<=6 for r in rows)
          assert all(r["features"]<=6 or r["usedFeatures"]==6 for r in rows)
          assert not any("sha256" in k.lower() for r in rows for k in r)
          assert len(set(r["id"] for r in rows))==188
          assert len(data["coverageConflict"]["summary"])==24
          models=[m for r in rows for v in r["variants"].values() for m in v.values() if m]
          assert len(models)==1442
          assert sum(m["complete"] for m in models)==179*8
          for m in models:
              assert 0<=m["candidate"]<=m["coverage"]+1e-7
              assert 0<=m["conflict"]<=m["coverage"]+1e-7
              assert abs(m["coverage"]+m["noMatchPct"]-100)<1e-6
              assert abs(m["meanMatchedRows"]+m["meanNoMatchRows"]-m["meanTestRows"])<1e-4
          import csv
          with open(root/"coverage_conflict_188.csv",encoding="utf-8-sig",newline="") as fd:
              summary=list(csv.DictReader(fd))
          assert len(summary)==188*4*2
          assert sum(x["complete_42seeds"]=="true" for x in summary)==179*8
          assert not any("sha256" in k.lower() for k in summary[0])
          with open(root/"coverage_conflict_group_summary.csv",encoding="utf-8-sig",newline="") as fd:
              assert len(list(csv.DictReader(fd)))==24
          ops=json.loads((root/"ops_progress.json").read_text(encoding="utf-8"))
          assert ops["fixed_model_total"]==31584
          assert ops["github_verified"]["successful_models"]==30078
          assert ops["github_verified"]["timeout_records"]==98
          assert ops["local_reported"]["timeout_records"]==154
          assert ops["local_reported"]["not_yet_attempted_models"]==1352
          assert ops["local_reported"]["successful_models"]==30078
          assert ops["delta"]["newly_reported_timeouts_without_checkpoint_bytes"]==56
          assert len(ops["per_incomplete_dataset"])==9
          assert sum(x["local_timeout_unverified"] for x in ops["per_incomplete_dataset"])==56
          assert sum(x["remaining_without_reported_outcome"] for x in ops["per_incomplete_dataset"])==1352
          assert ops["local_reported"]["successful_models"]+ops["local_reported"]["timeout_records"]+ops["local_reported"]["not_yet_attempted_models"]==31584
          assert ops["claims"]["new_timeout_checkpoint_uploaded"] is False
          assert (root/"index.html").exists()
          assert (root/"expanded42.css").exists()
          timeout=root/"timeout"
          assert (timeout/"index.html").exists()
          assert (timeout/"timeout.js").exists()
          assert (timeout/"timeout.css").exists()
          import gzip,hashlib,io
          digests={"per_source_observed.csv.gz":"cd76a5bca6e9cee37dce5cfc9f94bf5b5e4d309955212db52dcb81afc4a05ffc",
                   "per_source_scaling.csv.gz":"935e632e0da9aa62ec70fc9d314370259c03c1451a8f9bbfaca736c90f002090"}
          source_csv={}
          for name,digest in digests.items():
              uncompressed=gzip.decompress((timeout/name).read_bytes())
              assert hashlib.sha256(uncompressed).hexdigest()==digest,(name,"SHA mismatch")
              source_csv[name]=list(csv.DictReader(io.StringIO(uncompressed.decode("utf-8"))))
          assert len(source_csv["per_source_observed.csv.gz"])==181
          assert len(source_csv["per_source_scaling.csv.gz"])==48
          assert sum(x["degenerate_ladder"]=="True" for x in source_csv["per_source_scaling.csv.gz"])==11
          assert sum(x["many_rules"]=="True" for x in source_csv["per_source_scaling.csv.gz"])==17
          assert sum(int(float(x["timeouts"])) for x in source_csv["per_source_observed.csv.gz"])==70
          print("PASS: original raw CSV SHA256 and timeout data contracts")
          assert (root/"expanded42.js").exists()
          print("PASS: frozen 188 / 179 / 26 / 162 / 30,078 model contracts")
          PY
      - name: Install Chromium browser test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test 188-dataset search, feature groups, completeness, detail and mobile
        run: |
          python -m http.server 8765 --directory docs >/tmp/expanded42-http.log 2>&1 &
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          url="http://127.0.0.1:8765/research/teacher_dashboard/expanded42/"
          time.sleep(2)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width,height in [(1280,800),(390,844)]:
                  page=browser.new_page(viewport={"width":width,"height":height})
                  errors=[]
                  page.on("pageerror",lambda err:errors.append(str(err)))
                  res=page.goto(url,wait_until="networkidle",timeout=60000)
                  assert res.status==200,res.status
                  page.wait_for_function("document.querySelector('#loadStatus').textContent.includes('驗證完成')",timeout=15000)
                  page.wait_for_function("document.querySelector('#opsLoad').textContent.includes('已讀取')",timeout=15000)
                  assert page.locator("#opsDatasets tr").count()==9
                  assert "154" in page.locator("#opsTimeout").inner_text()
                  assert "1,352" in page.locator("#opsPending").inner_text()
                  assert "30,078" in page.locator("#opsSuccess").inner_text()
                  assert page.locator("#protocol-verified").count()==1
                  assert "64%" in page.locator("#protocol-verified").inner_text()
                  assert "Validation" in page.locator("#protocol-verified").inner_text()
                  assert page.locator("#datasetRows tr").count()==30
                  assert page.locator("#analysisRows tr").count()==4
                  assert page.locator("#variantTradeoff tr").count()==4
                  assert page.locator("#subgroupRows tr").count()>=3
                  assert "179" in page.locator("#analysisHeadline").inner_text()
                  page.select_option("#analysisGroup","FULL_FEATURE")
                  assert "25" in page.locator("#analysisHeadline").inner_text()
                  page.select_option("#subgroupDimension","CLASS_COUNT")
                  assert page.locator("#subgroupRows tr").count()>=2
                  page.select_option("#analysisVariant","B2_TRUE_AS_FALLBACK")
                  assert page.locator("#variantTradeoff tr").count()==4
                  page.select_option("#analysisGroup","ALL")
                  page.select_option("#subgroupDimension","ROW_SIZE")
                  assert "188／188" in page.locator("#showing").inner_text()
                  page.select_option("#featureGroup","FULL")
                  assert "26／188" in page.locator("#showing").inner_text()
                  page.select_option("#completion","INCOMPLETE")
                  assert "1／188" in page.locator("#showing").inner_text()
                  page.select_option("#featureGroup","LIMITED")
                  assert "8／188" in page.locator("#showing").inner_text()
                  page.select_option("#completion","ALL")
                  assert "162／188" in page.locator("#showing").inner_text()
                  page.fill("#search","Bioresponse")
                  assert "1／188" in page.locator("#showing").inner_text()
                  page.locator("#datasetRows button[data-detail]").click()
                  assert "Bioresponse" in page.locator("#detailTitle").inner_text()
                  assert page.locator("#detailResults tr").count()==4
                  assert page.locator("#detailAll tr").count()==8
                  assert "Development" in page.locator("#detailSplitContract").inner_text()
                  assert "Validation" in page.locator("#detailSplitContract").inner_text()
                  assert "Test" in page.locator("#detailSplitContract").inner_text()
                  page.select_option("#variant","B2_TRUE_AS_FALLBACK")
                  assert page.locator("#detailResults tr").count()==4
                  page.select_option("#scenario","FED_IID")
                  assert page.locator("#datasetRows tr").count()==1
                  assert not errors,errors
                  overflow=page.evaluate("document.documentElement.scrollWidth - window.innerWidth")
                  assert overflow<12,f"viewport={width}, overflow={overflow}"
                  print("PASS browser",width,"px: load/search/groups/detail/variant/scenario/mobile")
                  timeout_res=page.goto(url+"timeout/",wait_until="networkidle",timeout=60000)
                  assert timeout_res.status==200,timeout_res.status
                  page.wait_for_function("document.querySelector('#dataStatus').textContent.includes('已驗證')",timeout=15000)
                  assert page.locator("#scatterSvg circle").count()==181
                  assert page.locator("#scaleRows tr").count()==48
                  assert page.locator("#fastSlowCases tr").count()==7
                  page.select_option("#scaleScenario","FED_A01")
                  page.select_option("#tableScenario","FED_IID")
                  assert page.locator("#scaleRows tr").count()==24
                  page.select_option("#tableRisk","DEGENERATE")
                  assert page.locator("#scaleRows tr").count()>=1
                  assert not errors,errors
                  timeout_overflow=page.evaluate("document.documentElement.scrollWidth - window.innerWidth")
                  assert timeout_overflow<12,f"timeout viewport={width}, overflow={timeout_overflow}"
                  print("PASS timeout browser",width,"px: source-backed scatter, CI scaling, filters, mobile")
                  page.close()
              browser.close()
          PY
