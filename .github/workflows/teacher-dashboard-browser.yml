name: Teacher Dashboard - Real Browser QA
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - teacher_demo/test_teacher_dashboard_browser.py
      - .github/workflows/teacher-dashboard-browser.yml
      - docs/research/teacher_dashboard/dashboard.js
      - docs/research/teacher_dashboard/browser_engine_worker.js
      - docs/research/teacher_dashboard/runtime/engine.py
      - docs/research/teacher_dashboard/report.js
      - docs/research/teacher_dashboard/index.html
      - docs/research/teacher_dashboard/site.css
      - docs/research/teacher_dashboard/conflict/**
      - docs/research/teacher_dashboard/versions/**
      - docs/research/teacher_dashboard/public_data/**
      - docs/research/teacher_dashboard/public20/**
      - docs/research/teacher_dashboard/data_catalog/**
      - docs/research/teacher_dashboard/data/TEACHER_DATASET_*
      - docs/research/teacher_dashboard/data/TEACHER_UCI20_*
      - docs/research/teacher_dashboard/atlas/**
      - docs/research/teacher_dashboard/three_tracks/**
      - docs/research/teacher_dashboard/next12/**
      - docs/research/teacher_dashboard/conflict_atlas/**
      - docs/research/public_datasets_next12/**
      - docs/research/teacher_dashboard/data/PUBLIC_NEXT12_*
      - docs/research/public_datasets_20/**
      - docs/research/teacher_dashboard/data/PUBLIC20_*
      - docs/research/public_datasets/**
      - docs/research/teacher_dashboard/data/PUBLIC_COMMERCE_TECH_PILOT_*
      - docs/research/teacher_dashboard/methods/**
      - docs/research/teacher_dashboard/evidence/**
      - docs/research/teacher_dashboard/ranking/**
      - docs/research/teacher_dashboard/data/HAYES_HOLDOUT_PROTOCOLS_42SEEDS.csv
      - docs/research/teacher_dashboard/data/CONFLICT_EXACT_42SEEDS.csv
      - docs/research/teacher_dashboard/figures/**
      - docs/research/teacher_dashboard/lab/**
      - docs/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser driver
        run: python -m pip install playwright
      - name: Real browser end-to-end CSV trial
        run: python -m teacher_demo.test_teacher_dashboard_browser
