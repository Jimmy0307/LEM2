name: LEM2 Adaptive Six Policy - Nested 20 Datasets x 3 Seeds
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - .github/workflows/adaptive-six-policy-20-eval.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  leakage-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Test local/LODO selection cannot use withheld test metrics
        run: python -m pytest -q teacher_demo/test_adaptive_six_policy_selection.py
  real-public-source:
    needs: leakage-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        dataset: [adult_income, bank_marketing, banknote, breast_diagnostic, covertype, dry_bean, eeg_eye_state, german_credit, grid_stability, haberman, htru2, iris, letter, magic_gamma, mushroom, phishing, rice, sonar, spambase, wine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run original Classical LEM2, six resolvers and 64/16/20 nested comparison
        run: |
          for seed in 1 7 42; do
            python -m teacher_demo.adaptive_six_policy_runner \
              --dataset ${{ matrix.dataset }} \
              --seed "${seed}" \
              --output outputs/adaptive_six
          done
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-six-${{ matrix.dataset }}
          path: outputs/adaptive_six/ADAPTIVE_SIX_*
          if-no-files-found: error
          retention-days: 90
  lodo-aggregate:
    needs: real-public-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: adaptive-six-*
          path: adaptive_six_incoming
          merge-multiple: true
      - name: Fail-closed input/hash/row counts and leave-one-whole-dataset-out meta learning
        run: python -m teacher_demo.adaptive_six_policy_aggregate
      - name: Final audit of only executable selectors and diagnostic oracle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd,numpy as np
          root=Path("docs/research/teacher_dashboard/data")
          m=json.loads((root/"ADAPTIVE_SIX_20_MANIFEST.json").read_text(encoding="utf-8"))
          assert m["status"]=="VALIDATED_20_DOMAINS_3_SEEDS_6_POLICIES"
          assert m["frozen_rulesets"]==120 and m["policy_eval_rows"]==720
          a=pd.read_csv(root/"ADAPTIVE_SIX_20_ALL_POLICIES.csv")
          b=pd.read_csv(root/"ADAPTIVE_SIX_20_SELECTORS.csv")
          summary=pd.read_csv(root/"ADAPTIVE_SIX_20_SUMMARY.csv")
          ci=pd.read_csv(root/"ADAPTIVE_SIX_20_DATASET_BOOTSTRAP.csv")
          assert a.dataset.nunique()==b.dataset.nunique()==20
          assert sorted(a.seed.unique())==[1,7,42]
          assert a.groupby(["dataset","seed","client_count"]).size().eq(6).all()
          assert b.groupby(["dataset","seed","client_count","objective"]).size().eq(m["strategy_count"]).all()
          assert len(summary)==m["strategy_count"]*len(m["objectives"])
          assert len(ci)==27
          assert (b.test_regret_pp>=-1e-7).all()
          assert b[b.method.str.startswith("LODO")].meta_reference_dataset_count.eq(19).all()
          assert b[~b.method.eq("TEST_ORACLE_DIAGNOSTIC")].diagnostic_test_oracle_not_deployable.eq(False).all()
          print("ADAPTIVE_SIX_FULL_20_UCI_X3_SEED_NO_TEST_LEAK_QA_PASS",flush=True)
          PY
      - name: Publish inspected study evidence without changing frozen source matrices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --mixed FETCH_HEAD
          git add docs/research/teacher_dashboard/data/ADAPTIVE_SIX_20_*
          if ! git diff --cached --quiet; then
            git commit -m "research: 20-domain 3-seed nested six-policy meta selection LODO evidence [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-six-20-full-lodo-audit
          path: docs/research/teacher_dashboard/data/ADAPTIVE_SIX_20_*
          if-no-files-found: error
          retention-days: 90
