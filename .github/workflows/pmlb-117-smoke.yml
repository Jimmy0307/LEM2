name: LEM2 PMLB 117 External Source and Non-IID Smoke
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - .github/workflows/pmlb-117-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dataset: [iris, balance_scale, adult, monk1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Frozen PMLB source download and 64/16/20 IID + nonIID smoke
        run: |
          python -m teacher_demo.pmlb_117_runner --dataset "${{ matrix.dataset }}" --seeds 42 --scenarios IID,NONIID_01 --output outputs/pmlb
      - name: Require source hash and real IID LEM2 model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          d=Path("outputs/pmlb")
          receipts=list(d.glob("RECEIPT_*.json"))
          assert len(receipts)==1
          receipt=json.loads(receipts[0].read_text())
          assert receipt["dataset_source"],receipt
          assert len(receipt["dataset_source"]["source_gzip_sha256"])==64
          assert receipt["configs_passed"]>=1,receipt
          rows=pd.read_csv(next(d.glob("BENCHMARK_*.csv")))
          assert len(rows)>=6 and set(rows.policy)=={"FIRST_MATCH","SIMPLE_VOTING","STANDARD_VOTING","GLOBAL_STRENGTH","POPULATION_STANDARD","POPULATION_GLOBAL"}
          assert "IID" in set(rows.scenario)
          print("PMLB_BENCHMARK_REAL_SOURCE_LEM2_SMOKE_PASS",len(rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pmlb-smoke-${{ matrix.dataset }}
          path: outputs/pmlb/*
          if-no-files-found: error
          retention-days: 14
