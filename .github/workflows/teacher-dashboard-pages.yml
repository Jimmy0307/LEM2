name: Publish Teacher Dashboard to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teacher-dashboard-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure evidence generated by successful separate CI
        run: |
          test -s docs/research/teacher_dashboard/data/baseline_8820.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/research/teacher_dashboard/data/baseline_8820.json').read_text())
          assert x['validated_rows']==8820 and x['validated_seeds']==42
          print('PAGES_EVIDENCE_GATE_PASS')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build whitelisted site (never publish the whole docs/ tree)
        run: python -m experiments.redesign_20261116.build_public_site --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
