name: Publish Teacher Dashboard to GitHub Pages
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - docs/research/teacher_dashboard/**
      - .github/workflows/teacher-dashboard-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teacher-dashboard-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure evidence generated by successful separate CI
        run: |
          test -s docs/research/teacher_dashboard/data/baseline_8820.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/research/teacher_dashboard/data/baseline_8820.json').read_text())
          assert x['validated_rows']==8820 and x['validated_seeds']==42
          print('PAGES_EVIDENCE_GATE_PASS')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
