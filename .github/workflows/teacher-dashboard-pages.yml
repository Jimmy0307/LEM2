name: Publish Teacher Dashboard to GitHub Pages
on:
  push:
    branches:
      - research/report-ready-dashboard-20261109
    paths:
      - 'docs/research/teacher_dashboard/**'
      - 'docs/index.html'
      - '.github/workflows/teacher-dashboard-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teacher-dashboard-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure evidence generated by successful separate CI
        run: |
          test -s docs/research/teacher_dashboard/data/baseline_8820.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/research/teacher_dashboard/data/baseline_8820.json').read_text())
          assert x['validated_rows']==8820 and x['validated_seeds']==42
          print('PAGES_EVIDENCE_GATE_PASS')
          PY
      - name: Confirm six-question release evidence
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          base = Path('docs/research/teacher_dashboard')
          text = (base / 'index.html').read_text()
          assert '老師六個問題的回答' in text
          with (base / 'data/full_scale_20261118/FULL_SCALE_19COL.csv').open(newline='') as f:
              r = csv.reader(f)
              assert len(next(r)) == 19
              assert sum(1 for _ in r) == 21990
          assert (base / 'results/index.html').stat().st_size > 1000
          print('SIX_QUESTION_SITE_RELEASE_GATE_PASS')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
