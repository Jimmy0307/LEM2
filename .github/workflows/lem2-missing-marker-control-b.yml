name: LEM2 B Missing Marker Treatment - Controlled Adult and Bank
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - .github/workflows/lem2-missing-marker-control-b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  missingness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q teacher_demo/test_missing_marker_controlled.py
  missingness-study:
    needs: missingness-tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        dataset: [adult_income,bank_marketing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m teacher_demo.missing_marker_controlled_runner --dataset ${{ matrix.dataset }}
      - name: Preserve failures; verify matched baseline and test split contracts
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          d=Path("outputs/controlled_missing")
          receipt=list(d.glob("RECEIPT_B_*.json"))
          assert len(receipt)==1
          j=json.loads(receipt[0].read_text())
          a=pd.read_csv(d/f"ABLATION_B_{j['dataset']}.csv")
          assert len(a)==8*j["successful_models"]
          assert a.groupby(["dataset","seed","scenario","missing_treatment"]).size().eq(8).all()
          assert a.test_used_for_fit.eq(False).all()
          assert a.source_sha256.eq(j["source_sha256"]).all()
          assert a[a.missing_treatment.eq("PRESERVE")].groupby(["seed","scenario"]).size().eq(8).all()
          print("B_MISSING_DATA_PARITY_RESEARCH_PASS",j["dataset"],j["successful_models"],
             "of",j["expected_models"],"errors",j["failures"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-missing-controlled-${{ matrix.dataset }}
          path: outputs/controlled_missing/*
          if-no-files-found: warn
          retention-days: 90
