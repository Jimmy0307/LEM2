name: Teacher Full Factorial 210

on:
  push:
    branches:
      - research/full-factorial-20261029
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt matplotlib
      - name: Red-green contract tests
        run: python -m pytest -q teacher_demo/test_full_factorial_matrix.py

  partition:
    needs: contract
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - dataset: Hayes-Roth
            slug: hayes_roth
            split: FULL_DATA
          - dataset: Hayes-Roth
            slug: hayes_roth
            split: HOLDOUT_80_20
          - dataset: Car Evaluation
            slug: car_evaluation
            split: FULL_DATA
          - dataset: Car Evaluation
            slug: car_evaluation
            split: HOLDOUT_80_20
          - dataset: Balance Scale
            slug: balance_scale
            split: FULL_DATA
          - dataset: Balance Scale
            slug: balance_scale
            split: HOLDOUT_80_20
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt matplotlib
      - name: Run one 35-row partition
        run: |
          python -m teacher_demo.full_factorial_partition \
            --dataset "${{ matrix.dataset }}" \
            --split-mode "${{ matrix.split }}" \
            --output outputs/teacher_full_factorial_parts
      - name: Upload partition
        uses: actions/upload-artifact@v4
        with:
          name: lem2-part-${{ matrix.slug }}-${{ matrix.split }}
          path: outputs/teacher_full_factorial_parts/PART_*.csv
          if-no-files-found: error

  aggregate:
    needs: partition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt matplotlib
      - name: Download all partition artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lem2-part-*
          path: downloaded_parts
          merge-multiple: true
      - name: Aggregate, verify, and write final evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from teacher_demo.full_factorial_matrix import _validate_runtime_output, _write_outputs

          files = sorted(Path('downloaded_parts').glob('PART_*.csv'))
          assert len(files) == 6, files
          frames = [pd.read_csv(path) for path in files]
          df = pd.concat(frames, ignore_index=True)
          _validate_runtime_output(df)
          cfg = json.loads(Path('config.json').read_text(encoding='utf-8-sig'))
          out = Path('outputs/teacher_full_factorial_20261029')
          _write_outputs(df, out, cfg)
          print('FULL_FACTORIAL_VERDICT=PASS')
          print('PARTITIONS=', len(files))
          print('ROWS=', len(df))
          print('BASELINE_ROWS=', int((df['selection_policy'] == 'NONE').sum()))
          print('POLICY_ROWS=', int((df['selection_policy'] != 'NONE').sum()))
          PY
      - name: Verify final output contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('outputs/teacher_full_factorial_20261029')
          df = pd.read_csv(root / 'FULL_FACTORIAL_RESULTS.csv')
          assert len(df) == 210
          assert set(df['dataset']) == {'Hayes-Roth', 'Car Evaluation', 'Balance Scale'}
          assert set(df['split_mode']) == {'FULL_DATA', 'HOLDOUT_80_20'}
          assert set(df['system']) == {'CENTRALIZED', 'FEDERATED'}
          assert len(df[df['selection_policy'] == 'NONE']) == 30
          assert len(df[df['selection_policy'] != 'NONE']) == 180
          print('FINAL_OUTPUT_CONTRACT=PASS')
          PY
      - name: Build canonical tables, figures, findings, and checksums
        run: |
          python -m teacher_demo.publish_full_factorial_package \
            --source outputs/teacher_full_factorial_20261029 \
            --destination docs/research/full_factorial_20261029
      - name: Remove superseded teacher-demo result snapshots
        run: |
          git rm -f --ignore-unmatch \
            teacher_demo/CENTRALIZED_CONFLICT_STRUCTURE.csv \
            teacher_demo/CENTRALIZED_VS_FEDERATED.csv \
            teacher_demo/THREE_DATASET_METRIC_MEANS.csv
      - name: Verify published package
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path('docs/research/full_factorial_20261029')
          assert len(pd.read_csv(root / 'tables/FULL_FACTORIAL_RESULTS.csv')) == 210
          assert len(list((root / 'figures').glob('fig*.png'))) == 9
          assert len(list((root / 'figures').glob('fig*.svg'))) == 9
          assert (root / 'README.md').is_file()
          assert (root / 'FINDINGS.md').is_file()
          assert (root / 'MANIFEST_SHA256.txt').is_file()
          print('PUBLISHED_PACKAGE_VERDICT=PASS')
          PY
      - name: Commit canonical research package back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/full_factorial_20261029 teacher_demo/README_TEACHER_DEMO.md
          git add -u teacher_demo
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "docs: publish canonical full-factorial figures and results [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload factorial evidence
        uses: actions/upload-artifact@v4
        with:
          name: lem2-full-factorial-20261029
          path: |
            outputs/teacher_full_factorial_20261029/
            docs/research/full_factorial_20261029/
          if-no-files-found: error
