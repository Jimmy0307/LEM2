name: LEM2 G8 CPU Real Source Scaling 600-3200 Rows x 4-8 Features
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - .github/workflows/pmlb-resource-staircase.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [adult, magic, connect_4, spambase]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Measure actual CPU time and peak memory for full Classical LEM2
        run: python -m teacher_demo.pmlb_resource_staircase --dataset ${{ matrix.dataset }} --output outputs/pmlb_resource
      - name: Every resource trial must have source receipt
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          paths=list(Path("outputs/pmlb_resource").glob("SCALING_RECEIPT_*.json"))
          assert len(paths)==1
          j=json.loads(paths[0].read_text())
          assert j["planned"]==9
          assert j["source"] and len(j["source"]["source_gzip_sha256"])==64
          print("RESOURCE_SOURCE_RECEIPT",j["dataset"],j["successful"],"/9",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pmlb-scale-${{ matrix.dataset }}
          path: outputs/pmlb_resource/*
          if-no-files-found: error
          retention-days: 90
