name: Hayes-Roth group split exact leakage and diversity audit
on:
  push:
    branches: [research/audit-remediation-20261111]
    paths:
      - teacher_demo/audit_hayes_group_splits.py
      - teacher_demo/teacher_hayes_remediation.py
      - .github/workflows/hayes-group-audit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  group-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m teacher_demo.audit_hayes_group_splits
      - uses: actions/upload-artifact@v4
        with:
          name: hayes-42-group-split-fingerprints
          path: docs/research/teacher_dashboard/data/HAYES_GROUP_SPLIT_AUDIT_42SEEDS.csv
          if-no-files-found: error
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/teacher_dashboard/data/HAYES_GROUP_SPLIT_AUDIT_42SEEDS.csv
          git commit -m "data: Hayes-Roth full group split overlap and uniqueness audit [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
