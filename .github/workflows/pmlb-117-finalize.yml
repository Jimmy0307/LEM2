name: LEM2 PMLB 117 Source-Audited Meta-Selection and Robustness Finalize
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - .github/workflows/pmlb-117-finalize.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Paginated download of ALL 117 original source-fixed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming_pmlb_117 pmlb_archive
          gh run download 43576124536 --repo "${GITHUB_REPOSITORY}" --pattern "pmlb117-*" --dir pmlb_archive
          find pmlb_archive -type f -name "RECEIPT_*.json" -exec cp {} incoming_pmlb_117/ \;
          find pmlb_archive -type f -name "BENCHMARK_*.csv" -exec cp {} incoming_pmlb_117/ \;
          echo "SOURCE_FILES_RECEIPTS=$(find incoming_pmlb_117 -name 'RECEIPT_*.json' | wc -l)"
          echo "SOURCE_FILES_MODELS=$(find incoming_pmlb_117 -name 'BENCHMARK_*.csv' | wc -l)"
      - name: Count original 117 receipts with no missing candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("incoming_pmlb_117")
          files=list(p.glob("RECEIPT_*.json"))
          assert len(files)==117,f"Expected 117 receipts; got {len(files)}"
          counts={}
          for f in files:
              j=json.loads(f.read_text())
              status=j["research_status"]
              counts[status]=counts.get(status,0)+1
          print("SOURCE_RECEIPTS_117_COMPLETE",counts,flush=True)
          PY
      - name: Build family-aware LODO, 100+ SHA-deduplicated actual models, meta gains and failure audit
        run: python -m teacher_demo.pmlb_117_aggregate --input incoming_pmlb_117 --min-dataset-count 101
      - name: Validate audited publication and no test-tuned selection
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,json,numpy as np
          p=Path("docs/research/teacher_dashboard/data")
          m=json.loads((p/"PMLB_117_MANIFEST.json").read_text())
          assert m["status"]=="PASS_OVER_100_PUBLIC_BENCHMARK_TABLES"
          assert m["registered_candidates"]==117 and m["successful_iid_tables"]>=101
          assert m["unique_prepared_sha"]>=101
          x=pd.read_csv(p/"PMLB_117_SIX_POLICY_RAW.csv")
          s=pd.read_csv(p/"PMLB_117_POLICY_SELECTIONS.csv")
          assert x.groupby(["dataset","seed","scenario"]).size().eq(6).all()
          assert s.groupby(["dataset","seed","scenario","objective"]).size().eq(11).all()
          assert s[s.method.str.startswith("LOFO")].meta_reference_tables.ge(30).all()
          assert s.oracle_regret_pp.ge(-1e-7).all()
          assert s[s.method.eq("TEST_ORACLE_DIAGNOSTIC")].test_oracle_non_deployable.eq(True).all()
          print("PMLB_117_INDEPENDENT_SHA_CROSS_SOURCE_SELECTOR_G4_G5_G6_QA_PASS",flush=True)
          PY
      - name: Publish compact provenance, results and conditions (not third-party raw rows)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --mixed FETCH_HEAD
          git add docs/research/teacher_dashboard/data/PMLB_117_*
          if ! git diff --cached --quiet; then
            git commit -m "research: 117 public PMLB provenance, 100+ real-model six-policy IID/nonIID meta-selection [skip ci]"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pmlb117-audited-over-100-classification-tables
          path: docs/research/teacher_dashboard/data/PMLB_117_*
          if-no-files-found: error
          retention-days: 90
