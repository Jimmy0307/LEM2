name: redesign-publication-sha-reconcile
on:
  push:
    branches: [research/federated-rule-degeneracy-redesign-20261116]
    paths:
      - .github/workflows/redesign-manifest-reconcile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile-actual-git-blob-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconcile only proved Windows CRLF to Git LF change
        run: python -m experiments.redesign_20261116.reconcile_publication_manifest --apply
      - name: Ensure original research data files are byte-for-byte untouched
        run: |
          git diff --exit-code -- docs/research/redesign_20261116/data
          git diff --name-only
          python -m experiments.redesign_20261116.reconcile_publication_manifest
      - name: Commit only corrected website manifest (no rewrite)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/teacher_dashboard/data/redesign_20261116/REDESIGN_SITE_MANIFEST.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(site): reconcile 22 published CSV sha256 after Git CRLF-to-LF canonicalization"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
