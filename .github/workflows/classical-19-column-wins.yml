name: LEM2 19 Columns + Dataset Winner Counts
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - .github/workflows/classical-19-column-wins.yml
      - teacher_demo/build_19_column_wins.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Generate fair strategy-level 19-column data and six-policy winner counts
        run: python -m teacher_demo.build_19_column_wins
      - name: Verify exact schema and counts
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path("docs/research/teacher_dashboard/data")
          j=json.loads((p/"CLASSICAL_19_COLUMNS_MANIFEST.json").read_text())
          a=pd.read_csv(p/"CLASSICAL_19_COLUMNS_42SEEDS.csv")
          w=pd.read_csv(p/"SIX_POLICY_WIN_COUNTS_BY_DATASET.csv")
          assert j["columns"]==list(a.columns)
          assert len(a.columns)==19 and a.columns[-1]=="conflict_rate_pct"
          assert len(a)==9828
          assert (a.covered_count+a.no_match_count).eq(a.test_rows).all()
          assert a.conflict_rate_pct.between(0,100).all()
          assert w.compared_seed_count.ge(1).all()
          print("19_COLUMNS_PLUS_DATASET_WIN_COUNTS_PASS",len(a),len(w))
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/teacher_dashboard/data/CLASSICAL_19_COLUMNS_* docs/research/teacher_dashboard/data/SIX_POLICY_WIN_COUNTS_*
          if ! git diff --cached --quiet; then
            git commit -m "research: publish 19-column Classical conflict and six-policy winners [skip ci]"
            for n in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase FETCH_HEAD
              if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: classical-19-columns-dataset-wins
          path: |
            docs/research/teacher_dashboard/data/CLASSICAL_19_COLUMNS_*
            docs/research/teacher_dashboard/data/SIX_POLICY_WIN_COUNTS_*
          retention-days: 90
          if-no-files-found: error
