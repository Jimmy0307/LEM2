name: Apply Population Experiment Patch

on:
  push:
    branches:
      - research/conflict-client-sweep-20261020
    paths:
      - tools/apply_population_experiment_patch.py
      - tools/population_patch_trigger.txt

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/conflict-client-sweep-20261020
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact bounded patch
        run: python tools/apply_population_experiment_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q roughset main.py
      - name: Test
        run: python -m pytest -q
      - name: Diff check
        run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roughset/evaluation.py roughset/pipeline.py roughset/batch.py roughset/app.py config.json
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "feat: integrate six-policy population experiment"
            git push origin HEAD:research/conflict-client-sweep-20261020
          fi
