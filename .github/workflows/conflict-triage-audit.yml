name: Reconcile 42 Seed conflict cases from exact row receipts
on:
  push:
    branches: [research/audit-remediation-20261111]
    paths:
      - teacher_demo/rebuild_conflict_triage.py
      - .github/workflows/conflict-triage-audit.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42644663319
          pattern: teacher-trace-*
          path: downloaded_row_evidence
          merge-multiple: true
      - name: Independently reconcile row outcomes against 8820 baseline
        run: python -m teacher_demo.rebuild_conflict_triage --inputs downloaded_row_evidence
      - uses: actions/upload-artifact@v4
        with:
          name: exact-conflict-42-seeds-verified
          path: |
            docs/research/teacher_dashboard/data/CONFLICT_TRIAGE_42SEEDS.csv
            docs/research/teacher_dashboard/data/conflict_triage_42.json
          if-no-files-found: error
      - name: Commit audited decompositions to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/teacher_dashboard/data/CONFLICT_TRIAGE_42SEEDS.csv
          git add docs/research/teacher_dashboard/data/conflict_triage_42.json
          git commit -m "data: exact 42 seed per-object conflict and winner decomposition [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
