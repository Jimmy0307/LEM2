name: LEM2 Test Data Coverage - 42 Seeds Audit
on:
  push:
    branches: [research/report-ready-dashboard-20261109]
    paths:
      - .github/workflows/test-coverage-42.yml
      - teacher_demo/build_test_coverage_42.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derive-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy
      - name: Reconcile row-level no-match and candidate classification with frozen 8820
        run: python -m teacher_demo.build_test_coverage_42
      - name: Validate coverage counts and missingness contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          root=Path("docs/research/teacher_dashboard/data")
          iid=pd.read_csv(root/"TEST_COVERAGE_IID_42SEEDS.csv")
          non=pd.read_csv(root/"TEST_COVERAGE_NONIID_42SEEDS.csv")
          sm=pd.read_csv(root/"TEST_COVERAGE_42SEED_SUMMARY.csv")
          j=json.loads((root/"TEST_COVERAGE_OVERVIEW.json").read_text(encoding="utf-8"))
          assert len(iid)==7560 and len(non)==6048
          assert j["random_seeds"]==42 and len(j["summary"])==len(sm)
          assert iid.fallback_correct_count.notna().all()
          assert non.fallback_correct_count.isna().all()
          assert non.covered_only_accuracy_pct.isna().all()
          assert sm.seeds.eq(42).all()
          for df in [iid,non]:
              assert df.test_coverage_pct.between(0,100).all()
              assert df.candidate_coverage_pct.between(0,100).all()
              assert df.conflict_rate_pct.between(0,100).all()
              assert np.allclose(df.test_coverage_pct+df.test_no_match_pct,100,atol=1e-8)
              assert (df.true_in_candidate_count<=df.test_covered_count).all()
          a=iid[iid.split_mode.eq("HOLDOUT_80_20")]
          assert len(a)==3780
          print("TEST_COVERAGE_42SEED_VERDICT=PASS",len(iid),len(non),len(sm))
          PY
      - name: Publish per-policy test coverage evidence and auditable summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/teacher_dashboard/data/TEST_COVERAGE_*
          if ! git diff --cached --quiet; then
            git commit -m "research: publish 42-seed test/candidate/covered coverage evidence [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lem2-test-coverage-42
          path: docs/research/teacher_dashboard/data/TEST_COVERAGE_*
          retention-days: 90
          if-no-files-found: error
