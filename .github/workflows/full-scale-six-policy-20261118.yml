name: Full-scale six-policy research 20261118
on:
  # workflow_dispatch only works once this file exists on the default branch (main),
  # which this research task may not modify. Pushing a change to RUN_REQUEST.json on
  # the research branch runs the same pipeline with the inputs stored in that file.
  push:
    branches:
      - research/full-scale-six-policy-20261118
    paths:
      - experiments/full_scale_20261118/RUN_REQUEST.json
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of deterministic shards (11–256)
        type: number
        default: 24
        required: true
      seeds:
        description: Comma-separated split seeds
        type: string
        default: "1001,1002,1003,1004,1005"
        required: true
      smoke:
        description: Run only five small datasets and one seed
        type: boolean
        default: true
        required: true
permissions:
  contents: write
  actions: write
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      datasets: ${{ steps.matrix.outputs.datasets }}
      shards: ${{ steps.matrix.outputs.shards }}
      g5: ${{ steps.matrix.outputs.g5 }}
      smoke_url: ${{ steps.matrix.outputs.smoke_url }}
      smoke: ${{ steps.resolve.outputs.smoke }}
      seeds: ${{ steps.resolve.outputs.seeds }}
      shard_count: ${{ steps.resolve.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve run inputs (workflow_dispatch inputs or RUN_REQUEST.json)
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          IN_SMOKE: ${{ inputs.smoke }}
          IN_SEEDS: ${{ inputs.seeds }}
          IN_SHARDS: ${{ inputs.shard_count }}
        run: |
          python - <<'PYRESOLVE'
          import json, os
          if os.environ['EVENT'] == 'workflow_dispatch':
              smoke, seeds, shards = os.environ['IN_SMOKE'], os.environ['IN_SEEDS'], os.environ['IN_SHARDS']
          else:
              req = json.load(open('experiments/full_scale_20261118/RUN_REQUEST.json', encoding='utf-8'))
              smoke, seeds, shards = req['smoke'], req['seeds'], req['shard_count']
          smoke = str(smoke).strip().lower()
          if smoke not in ('true', 'false'):
              raise SystemExit(f'smoke must be true/false, got {smoke!r}')
          shards = int(shards)
          seeds = ','.join(str(int(x)) for x in str(seeds).split(',') if x.strip())
          print(f'smoke={smoke} seeds={seeds} shard_count={shards}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for key, value in (('smoke', smoke), ('seeds', seeds), ('shard_count', shards)):
                  print(f'{key}={value}', file=out)
          PYRESOLVE
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt scipy pyarrow
      - name: Check equivalence and build deterministic matrix
        id: matrix
        env:
          SHARD_COUNT: ${{ steps.resolve.outputs.shard_count }}
          SEEDS: ${{ steps.resolve.outputs.seeds }}
          SMOKE: ${{ steps.resolve.outputs.smoke }}
        run: |
          python -m pytest tests/test_full_scale_resolve_equivalence.py experiments/full_scale_20261118 -q
          python -m experiments.full_scale_20261118.workflow_matrix --shard-count "$SHARD_COUNT" --seeds "$SEEDS"
          if [ "$SMOKE" = "false" ]; then
            python - <<'PYCHECK'
          import json, os
          from pathlib import Path
          p = Path('docs/research/full_scale_20261118/SMOKE_RUN.json')
          if not p.is_file():
              raise SystemExit('Full run requires an already passed GitHub smoke run.')
          info = json.loads(p.read_text(encoding='utf-8'))
          prefix = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
          if info.get('status') != 'passed' or not info.get('run_url', '').startswith(prefix):
              raise SystemExit('SMOKE_RUN.json is missing a passed run for this repository.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('smoke_url=' + info['run_url'] + '\n')
          PYCHECK
          fi
  smoke:
    if: ${{ needs.setup.outputs.smoke == 'true' }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt scipy pyarrow
      - name: Five small datasets and one seed
        env:
          SEEDS: ${{ needs.setup.outputs.seeds }}
        run: python -m experiments.full_scale_20261118.shard --shard 0 --smoke --seeds "$SEEDS" --output "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: shard-0
          path: ${{ runner.temp }}/shard/*.csv
          if-no-files-found: warn
  verify_g5:
    if: ${{ needs.setup.outputs.smoke != 'true' }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.setup.outputs.g5) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt scipy pyarrow
      - name: Compare uncapped G5 sources to the frozen results
        id: check
        env:
          G5_DID: ${{ matrix.did }}
        run: |
          mkdir -p "$RUNNER_TEMP/g5-report"
          python -m experiments.full_scale_20261118.validate_g5 --cache "$RUNNER_TEMP/g5-cache" --failures "$RUNNER_TEMP/g5-report/failures_g5.csv" --did "$G5_DID"
      - name: Preserve the G5 failure log and report
        if: ${{ always() }}
        run: |
          python - <<'PYG5'
          import csv, os, shutil
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'g5-report'
          folder.mkdir(parents=True, exist_ok=True)
          p = folder / 'failures_g5.csv'
          if p.exists():
              shutil.copyfile(p, folder / 'FAILURES.csv')
              with p.open(encoding='utf-8', newline='') as source:
                  rows = list(csv.DictReader(source))
              (folder / 'G5_FAILURE_REPORT.md').write_text('# G5 驗證失敗與重試\n\n' + '\n'.join(str(r) for r in rows), encoding='utf-8')
          PYG5
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: g5-validation-${{ matrix.did }}-${{ github.run_id }}
          path: ${{ runner.temp }}/g5-report/*
          if-no-files-found: ignore
      - name: Stop the run on G5 mismatch or conflict-bound violation
        if: ${{ always() && steps.check.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          G5_DID: ${{ matrix.did }}
        run: |
          if python - <<'PYG5STOP'
          import csv, os, sys
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'g5-report' / 'failures_g5.csv'
          stop = False
          if p.exists():
              with p.open(encoding='utf-8', newline='') as source:
                  stop = any(r.get('status') in ('G5_MISMATCH', 'ConflictBoundViolation') for r in csv.DictReader(source))
          sys.exit(0 if stop else 1)
          PYG5STOP
          then
            DEST="docs/research/full_scale_20261118/g5_stop_${GITHUB_RUN_ID}_${G5_DID}"
            if [ ! -e "$DEST" ]; then
              mkdir -p "$DEST"
              cp "$RUNNER_TEMP/g5-report/FAILURES.csv" "$DEST/FAILURES.csv"
              cp "$RUNNER_TEMP/g5-report/G5_FAILURE_REPORT.md" "$DEST/FULL_SCALE_REPORT.md"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add "$DEST"
              if git commit -m "Record stopped G5 mismatch" && git push origin HEAD:"$GITHUB_REF_NAME"; then
                echo "G5 stop report committed."
              else
                echo "Could not commit G5 stop report; the uploaded artifact retains it." >&2
              fi
            fi
            gh run cancel "$GITHUB_RUN_ID"
          fi
  g5_stop_report:
    if: ${{ always() && needs.setup.outputs.smoke != 'true' && needs.setup.result == 'success' && needs.verify_g5.result == 'failure' }}
    needs: [setup, verify_g5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: g5-validation-*
          path: ${{ runner.temp }}/g5-input
      - name: Consolidate G5 failures without publishing partial result tables
        run: |
          python - <<'PYSTOP'
          import csv, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          rows = []
          for p in (root / 'g5-input').rglob('failures_g5.csv'):
              with p.open(encoding='utf-8', newline='') as f:
                  rows.extend(csv.DictReader(f))
          if not rows:
              rows = [{'phase': 'G5_VERIFICATION', 'status': 'MISSING_G5_FAILURE_ARTIFACT',
                       'error': 'G5 verification failed without an available failure artifact.'}]
          columns = ['dataset', 'seed', 'system', 'distribution', 'phase', 'status', 'error']
          out = root / 'g5-stop'
          out.mkdir(parents=True, exist_ok=True)
          with (out / 'FAILURES.csv').open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=columns, extrasaction='ignore')
              writer.writeheader()
              writer.writerows(rows)
          (out / 'FULL_SCALE_REPORT.md').write_text('# G5 驗證中止\n\n全量工作未啟動。失敗明細見 FAILURES.csv。\n\n' + '\n'.join(str(r) for r in rows), encoding='utf-8')
          PYSTOP
      - uses: actions/upload-artifact@v4
        with:
          name: g5-stop-report-${{ github.run_id }}
          path: ${{ runner.temp }}/g5-stop/*
          if-no-files-found: error
      - name: Preserve the stopped run in a new research directory
        run: |
          DEST="docs/research/full_scale_20261118/g5_stop_${GITHUB_RUN_ID}"
          if [ -e "$DEST" ]; then
            echo "Refusing to overwrite an existing stopped-run record" >&2
            exit 1
          fi
          mkdir -p "$DEST"
          cp "$RUNNER_TEMP/g5-stop/FAILURES.csv" "$RUNNER_TEMP/g5-stop/FULL_SCALE_REPORT.md" "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m "Record stopped G5 validation"
          git push origin HEAD:"$GITHUB_REF_NAME"
  central:
    if: ${{ needs.setup.outputs.smoke != 'true' }}
    needs: [setup, verify_g5]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.setup.outputs.datasets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt scipy pyarrow
      - name: Dataset and scenario model slice
        id: execute
        env:
          DATASET: ${{ matrix.dataset }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.setup.outputs.shard_count }}
          SEEDS: ${{ needs.setup.outputs.seeds }}
        run: |
          python -m experiments.full_scale_20261118.shard --shard "$SHARD" --shard-count "$SHARD_COUNT" --dataset "$DATASET" --scenarios CENTRALIZED --seeds "$SEEDS" --output "$RUNNER_TEMP/shard"
      - name: Preserve conflict-bound report
        if: ${{ always() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PYREPORT'
          import csv, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'shard'
          path = folder / ('failures_' + os.environ['SHARD'] + '.csv')
          if path.exists():
              with path.open(encoding='utf-8', newline='') as f:
                  matches = [r for r in csv.DictReader(f) if r.get('status') == 'ConflictBoundViolation']
              if matches:
                  (folder / 'CONFLICT_REPORT.md').write_text('# Conflict 上界違反，實驗已中止\n\n' + '\n'.join(str(x) for x in matches), encoding='utf-8')
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dataset-${{ matrix.shard }}-${{ matrix.token }}-CENTRALIZED
          path: ${{ runner.temp }}/shard/*
          if-no-files-found: warn
      - name: Stop the run on a conflict-bound violation
        if: ${{ always() && steps.execute.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TOKEN: ${{ matrix.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -f "$RUNNER_TEMP/shard/CONFLICT_REPORT.md" ]; then
            DEST="docs/research/full_scale_20261118/conflict_stop_${GITHUB_RUN_ID}_${RUN_TOKEN}_${GITHUB_JOB}"
            if [ ! -e "$DEST" ]; then
              mkdir -p "$DEST"
              cp "$RUNNER_TEMP/shard/failures_${SHARD}.csv" "$DEST/FAILURES.csv"
              cp "$RUNNER_TEMP/shard/CONFLICT_REPORT.md" "$DEST/FULL_SCALE_REPORT.md"
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add "$DEST"
              if git commit -m "Record stopped conflict-bound violation" && git push origin HEAD:"$GITHUB_REF_NAME"; then
                echo "Conflict stop report committed."
              else
                echo "Could not commit conflict stop report; the uploaded artifact retains it." >&2
              fi
            fi
            gh run cancel "$GITHUB_RUN_ID"
          fi
  iid:
