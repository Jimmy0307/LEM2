          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt scipy pyarrow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dataset-${{ matrix.shard }}-*
          path: ${{ runner.temp }}/datasets
      - name: Merge one shard and account for missing jobs
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.setup.outputs.shard_count }}
          SEEDS: ${{ needs.setup.outputs.seeds }}
        run: |
          python -m experiments.full_scale_20261118.merge_shard --artifacts "$RUNNER_TEMP/datasets" --output "$RUNNER_TEMP/shard" --shard "$SHARD" --shard-count "$SHARD_COUNT" --seeds "$SEEDS"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard/*
          if-no-files-found: warn
  aggregate:
    if: ${{ always() && needs.setup.result == 'success' && (needs.setup.outputs.smoke == 'true' || needs.verify_g5.result == 'success') }}
    needs: [setup, smoke, verify_g5, merge_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt scipy pyarrow
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/artifacts
      - uses: actions/download-artifact@v4
        if: ${{ needs.setup.outputs.smoke != 'true' }}
        continue-on-error: true
        with:
          pattern: g5-validation-*
          path: ${{ runner.temp }}/artifacts
      - name: Validate and produce outputs
        id: aggregate
        env:
          SMOKE: ${{ needs.setup.outputs.smoke }}
          SEEDS: ${{ needs.setup.outputs.seeds }}
          SMOKE_URL: ${{ needs.setup.outputs.smoke_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SMOKE" = "true" ]; then
            python -m experiments.full_scale_20261118.aggregate --artifacts "$RUNNER_TEMP/artifacts" --output "$RUNNER_TEMP/report" --seeds "$SEEDS" --smoke --run-url "$RUN_URL"
          else
            python -m experiments.full_scale_20261118.aggregate --artifacts "$RUNNER_TEMP/artifacts" --output docs/research/full_scale_20261118 --seeds "$SEEDS" --run-url "$RUN_URL" --smoke-url "$SMOKE_URL"
          fi
      - name: Record a passed smoke run
        if: ${{ needs.setup.outputs.smoke == 'true' && steps.aggregate.outcome == 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PYSMOKE'
          import json, os
          from pathlib import Path
          p = Path('docs/research/full_scale_20261118/SMOKE_RUN.json')
          p.write_text(json.dumps({'status': 'passed', 'run_url': os.environ['RUN_URL'], 'commit_sha': os.environ['GITHUB_SHA']}, indent=2) + '\n', encoding='utf-8')
          PYSMOKE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/research/full_scale_20261118/SMOKE_RUN.json
          git diff --cached --quiet || git commit -m "Record full-scale smoke run"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Commit newly produced full-scale outputs
        if: ${{ always() && needs.setup.outputs.smoke != 'true' && steps.aggregate.outcome != 'skipped' }}
        run: |
          if [ -f docs/research/full_scale_20261118/MANIFEST.json ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/research/full_scale_20261118
            git diff --cached --quiet || git commit -m "Publish full-scale six-policy results"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Upload smoke report
        if: ${{ always() && needs.setup.outputs.smoke == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: ${{ runner.temp }}/report/*
          if-no-files-found: warn
      - name: Upload full-scale report
        if: ${{ always() && needs.setup.outputs.smoke != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-scale-report-${{ github.run_id }}
          path: docs/research/full_scale_20261118/*
          if-no-files-found: warn
