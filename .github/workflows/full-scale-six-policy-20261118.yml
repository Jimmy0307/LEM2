  merge_shards:
    if: ${{ always() && needs.setup.outputs.smoke != 'true' && needs.setup.result == 'success' && needs.verify_g5.result == 'success' }}
    needs: [setup, verify_g5, central, iid, a05, a01]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
