name: Teacher research remediation - real browser and metrics
on:
  push:
    branches: [research/audit-remediation-20261111]
    paths:
      - docs/research/teacher_dashboard/research_quality.js
      - docs/research/teacher_dashboard/research_quality.css
      - docs/research/teacher_dashboard/index.html
      - teacher_demo/test_teacher_remediation_browser.py
      - .github/workflows/teacher-remediation-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install playwright pandas numpy
      - name: Source syntax and 8820 source integrity
        run: |
          node --check docs/research/teacher_dashboard/research_quality.js
          node --check docs/research/teacher_dashboard/report.js
          python -m teacher_demo.build_teacher_comparison
      - name: Full desktop and mobile browser presentation QA
        run: python -m teacher_demo.test_teacher_remediation_browser
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-remediation-browser-screenshots
          path: outputs/audit_browser/*.png
          if-no-files-found: error
