name: Teacher non-IID Dirichlet pilot
on:
  push:
    branches: [research/teacher-evidence-42-20261109]
    paths: [teacher_demo/teacher_non_iid_pilot.py, .github/workflows/teacher-non-iid-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 42]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run non-IID on same 80:20 holdout
        run: python -m teacher_demo.teacher_non_iid_pilot --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-non-iid-seed-${{ matrix.seed }}
          path: outputs/teacher_non_iid_pilot/*.csv
          if-no-files-found: error
          retention-days: 90
