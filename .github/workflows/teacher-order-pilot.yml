name: Teacher client-order exhaustive pilot
on:
  push:
    branches: [research/teacher-evidence-42-20261109]
    paths: [teacher_demo/teacher_order_pilot.py, .github/workflows/teacher-order-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Exhaustively evaluate FIRST_MATCH across all C2-C5 arrival orders
        run: python -m teacher_demo.teacher_order_pilot --seed 42
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-order-exhaustive-seed42
          path: outputs/teacher_client_order_pilot/*.csv
          if-no-files-found: error
